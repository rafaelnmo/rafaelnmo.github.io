<footer class="site-footer">
    <div class="container site-footer__inner">
        <span>&copy; <span id="year">{{ site.time | date: "%Y" }}</span> {{ site.author.name }} · {{ site.author.city }}, {{ site.author.country }}</span>
        <div class="socials">
            <a href="mailto:{{ site.author.email }}" aria-label="Email">{% include icon.html name="mail" %}</a>
            <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">{% include icon.html name="linkedin" %}</a>
            <a href="{{ site.author.github }}" target="_blank" rel="noopener" aria-label="GitHub">{% include icon.html name="github" %}</a>
        </div>
    </div>
</footer>
